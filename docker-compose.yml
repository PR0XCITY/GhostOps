# MiniStack: free, MIT-licensed local AWS emulator (https://github.com/ministackorg/ministack).
# Used by GhostOps only as the shadow-execution target. Never real AWS.
# Start:  docker compose up -d
# Health: http://localhost:4566/_ministack/health
#
# Deliberately NOT mounting /var/run/docker.sock: GhostOps only needs control-plane
# resources (EC2 metadata, IAM, S3), and the socket would give the container
# control of the host's Docker.
services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ghostops-ministack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - GATEWAY_PORT=4566
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
